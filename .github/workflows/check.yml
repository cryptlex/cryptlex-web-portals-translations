name: Check translations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Keys and placeholders match en.json
        run: node scripts/check.mjs

      - name: en.json is unchanged
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'en.json'; then
            echo "::error file=en.json::en.json is the English source and is maintained by Cryptlex. Change only the translation files."
            exit 1
          fi
